    </head>
    <body>
        <div class="card">
            <div class="header">
                <h1>Web Solutions Ltda.</h1>
            </div>
            <div class="content">
                <div class="status">Servidor operacional</div>
                <table>
                    <tr>
                        <td>Servidor</td>
                        <td>Nginx</td>
                    </tr>
                    <tr>
                        <td>Porta</td>
                        <td>8080</td>
                    </tr>
                    <tr>
                        <td>Container</td>
                        <td>nginx:alpine</td>
                    </tr>
                    <tr>
                        <td>Orquestrador</td>
                        <td>Kubernetes</td>
                    </tr>
                </table>
            </div>
        </div>
    </body>
    </html>

