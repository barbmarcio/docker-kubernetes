---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Web Solutions - Nginx</title>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: #f5f5f5;
                margin: 0;
                padding: 40px 20px;
                color: #333;
            }
            .card {
                max-width: 400px;
                margin: 0 auto;
                background: #fff;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                overflow: hidden;
            }
            .header {
                background: #2563eb;
                color: #fff;
                padding: 20px;
            }
            .header h1 {
                margin: 0;
                font-size: 18px;
                font-weight: 600;
            }
            .content {
                padding: 24px;
            }
            .status {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 20px;
                padding: 12px;
                background: #f0fdf4;
                border-radius: 6px;
                color: #166534;
                font-weight: 500;
            }
            .status::before {
                content: '';
                width: 8px;
                height: 8px;
                background: #22c55e;
                border-radius: 50%;
            }
            table {
                width: 100%;
                border-collapse: collapse;
            }
            td {
                padding: 10px 0;
                border-bottom: 1px solid #eee;
            }
            td:first-child {
                color: #666;
                font-size: 14px;
            }
            td:last-child {
                text-align: right;
                font-weight: 500;
            }
            tr:last-child td {
                border-bottom: none;
            }
